name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Job 1: Build + Resources/Tools (no credentials needed) ─────────────────
  build-and-test-resources:
    name: Build + Resources & Tools
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Test resources & tools (no API calls)
        run: node dist/test-resources.js

  # ── Job 2: E2E (requires secrets, only runs on merge to master) ────────────
  e2e:
    name: E2E — Full API Test
    runs-on: ubuntu-latest
    # Only run on push to master (merged PR), not on PR branches
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test-resources

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Run E2E tests
        env:
          PAPERID_TOKEN:      ${{ secrets.PAPERID_TOKEN }}
          PAPERID_COMPANY_ID: ${{ secrets.PAPERID_COMPANY_ID }}
          PAPERID_USER_ID:    ${{ secrets.PAPERID_USER_ID }}
          PAPERID_PHONE:      ${{ secrets.PAPERID_PHONE }}
        run: node dist/test.js

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            dist/
          retention-days: 7
